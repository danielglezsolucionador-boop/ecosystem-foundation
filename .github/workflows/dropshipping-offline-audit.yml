name: Dropshipping offline audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/web/control-center/**'
      - 'scripts/validate_dropshipping_audit.py'
      - 'scripts/validate_dropshipping_browser.py'
      - '.github/workflows/dropshipping-offline-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    if: github.head_ref == 'feature/dropshipping-pe-offline'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest httpx
      - run: python scripts/validate_dropshipping_audit.py
      - run: |
          node --check apps/web/control-center/assets/app.js
          node --check apps/web/control-center/assets/dropshipping-pe.js
          node --check apps/web/control-center/assets/storefront-pe.js
  regression:
    if: github.head_ref == 'feature/dropshipping-pe-offline'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest httpx
      - run: python scripts/validate_dropshipping_audit.py --full
  browser:
    if: github.head_ref == 'feature/dropshipping-pe-offline'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/validate_dropshipping_browser.py
  baseline-regression:
    if: github.head_ref == 'feature/dropshipping-pe-offline'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e8b3e87fdb6626f82f28b47c154c412df965ac08
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest httpx
      - name: Run unchanged baseline without external services
        env:
          ECOSYSTEM_API_ENVIRONMENT: local
          ECOSYSTEM_API_DATABASE_URL: sqlite:///./var/baseline-audit.db
          CONTROL_CENTER_AUTH_ENABLED: 'true'
          CEREBRO_LLM_ENABLED: 'false'
          ARSENAL_API_BROKER_ENABLED: 'false'
          LINKEDIN_POSTING_ENABLED: 'false'
        run: python -m pytest -q apps/api/tests
